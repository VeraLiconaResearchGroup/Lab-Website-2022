- title: "Benchmarking time-series data discretization on inference methods"
  image: pandapas.png
  description: In this paper we introduce DiscreeTest, a two-step evaluation metric for ranking discretization methods for time-series data. To our knowledge, this is the first time that a method for benchmarking and selecting an appropriate discretization method for time-series data has been proposed.
  authors: Yuezhe Li, Tiffany Jann, Paola Vera-Licona
  link:
    url: https://academic.oup.com/bioinformatics/article/35/17/3102/5292317?login=true
    display:  Bioinformatics, Volume 35, Issue 17 (2019)
  highlight: 1
  news2: DiscreeTest code can be found <a href="https://github.com/VeraLiconaResearchGroup/Benchmarking_TSDiscretizations"> here</a>.

- title: "Chromatin interaction networks revealed unique connectivity patterns of broad H3K4me3 domains and super enhancers in 3D chromatin"
  image: asa2.png
  description: In this paper from our collaboration with the <a href='https://www.ucarlab.com/'>Ucar Lab</a>, we studied chromatin interaction networks. We contributed to this paper by applying the less commonly used network theory concepts of graphlets and their orbits to describe and characterize the connectivity patterns of nodes in chromatin interaction networks. 
