- title: "NETISCE: A Network-Based Tool for Cell Fate Reprogramming"
  image: netisce2.png
  description: We present NETISCE, a novel computational tool for identifying cell fate reprogramming targets in static networks. In combination with machine learning algorithms, NETISCE estimates the attractor landscape and predicts reprogramming targets using Signal Flow Analysis and Feedback Vertex Set Control, respectively.
  authors: Lauren Marazzi, Milan Shah, Shreedula Balakrishnan, Ananya Patil, Paola Vera-Licona
  link:
    url: https://www.nature.com/articles/s41540-022-00231-y
    display: npj Systems Biology and Applications volume 8, Article number 21 (2022)
  highlight: 1
  news2: NETISCE software tool can be found <a href="http://veraliconalab.org/Netisce/"> here</a>.

