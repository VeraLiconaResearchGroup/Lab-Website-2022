- title: "OCSANA+ Optimal Control and Simulation of Signaling Networks from Network Analysis"
  image: ocsanaplus2.png
  description: OCSANA+ is a Cytoscape app for identifying nodes to drive the system toward a desired long-term behavior, prioritizing combinations of interventions in large-scale complex networks, and estimating the effects of node perturbations in signaling networks, all based on the analysis of the network’s structure.
  authors: Lauren Marazzi, Andrew Gainer-Dewar, Paola Vera-Licona
  link:
    url: https://academic.oup.com/bioinformatics/article/36/19/4960/5872521?login=false
    display:  Bioinformatics, Volume 36, Issue 19 (2020)
  highlight: 1
  news2: OCSANA+ software tool can be found <a href="http://veraliconalab.org/OCSANA-Plus/"> here</a>.

