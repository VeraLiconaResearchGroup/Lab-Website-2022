- title: "The minimal hitting set generation problem: algorithms and computation"
  image: mhs3.png
  authors: Andrew Gainer-Dewar, Paola Vera-Licona
  description: Finding inclusion-minimal hitting sets (MHSs) for a given family of sets is a fundamental combinatorial problem with applications in domains as diverse as Boolean algebra, computational biology, and data mining. In this paper we survey and benchmark several algorithms for MHS generation from across a variety of domains.  We find that the fastest algorithms in practice are not those with the tightest complexity bounds or those most commonly used in applications.
  link:
    url: https://epubs.siam.org/doi/abs/10.1137/15M1055024
    display:  SIAM Journal on Discrete Mathematics Vol. 31 (2017)
  highlight: 1
  news2:

- title: "QuIN: a web server for querying and visualizing chromatin interaction networks"
  image: quin.png
  description: First paper from our collaboration with the <a href='https://www.ucarlab.com/'>Ucar Lab</a> to develop a tool for querying and visualizing chromatin interaction networks. This is the first publicly available software for analysis of chromatin interaction networks that is web-accessible and easy to use, making it suitable for molecular biologists with no programming experience. 
  authors: Asa Thibodeau, Eladio J Márquez, Oscar Luo, Yijun Ruan, Francesca Menghi, Dong-Guk Shin, Michael L Stitzel, Paola Vera-Licona, Duygu Ucar
  link:
    url: https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1004809
    display:  PLoS Comput Biol 12, 6 (2016)
  highlight: 1
  news2:

