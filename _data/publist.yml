- title: "An Algebra-Based Method for Inferring Gene Regulatory Networks"
  image: IRMA.png
  description: In this paper we developed a novel reverse-engineering method for inferring gene regulatory networks within the Boolean modeling framework. This method is innovative in that the inference problem is framed in computational algebra terms to enable precise algebraic characterization of the models search space.
  authors: Paola Vera-Licona, Abdul Jarrah, Luis D Garcia-Puente, John McGee, Reinhard Laubenbacher
  link:
    url: https://iopscience.iop.org/article/10.1088/1361-6528/ab1c7f/pdf
    display: BMC Systems Biology volume 8, Article number 37 (2014)
  highlight: 1
  news2: This paper was **Selected as Editors Picks**